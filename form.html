<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website for WDD 131 - Dynamic Web Fundamentals for David Poulsen.">
    <meta name="author" content="David Poulsen">
    <title>WDD 131 – Dynamic Web Fundamentals – David Poulsen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <link href="styles/formlarge.css" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>

</head>
<body>

  <header>
    <h1>Product Review</h1>
  </header>


  <form method="get" action="review.html">

    <label for="productName">Product Name</label>
    <select id="productName" name="productName" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <fieldset>
      <legend>Overall Rating</legend>

      <label for="rating1">1 ☆</label>
      <input type="radio" id="rating1" name="rating" value="1" required>

      <label for="rating2">2 ☆☆</label>
      <input type="radio" id="rating2" name="rating" value="2" required>

      <label for="rating3">3 ☆☆☆</label>
      <input type="radio" id="rating3" name="rating" value="3" required>

      <label for="rating4">4 ☆☆☆☆</label>
      <input type="radio" id="rating4" name="rating" value="4" required>

      <label for="rating5">5 ☆☆☆☆☆</label>
      <input type="radio" id="rating5" name="rating" value="5" required>
    </fieldset>

    <label for="installDate">Date of Installation</label>
    <input type="date" id="installDate" name="installDate" required>

    <fieldset>
      <legend>Useful Features (Check all that apply)</legend>
        <!-- Checkbox input -->
      <label for="feature1">Easy Setup</label>
      <input type="checkbox" id="feature1" name="features" value="Easy Setup">

      <label for="feature2">Durable</label>
      <input type="checkbox" id="feature2" name="features" value="Durable">

      <label for="feature3">Energy Efficient</label>
      <input type="checkbox" id="feature3" name="features" value="Energy Efficient">

      <label for="feature4">Compact Design</label>
      <input type="checkbox" id="feature4" name="features" value="Compact Design">
    </fieldset>

    <label for="writtenReview">Written Review</label>
    <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

    <label for="userName">Your Name</label>
    <input type="text" id="userName" name="userName">

    <input type="submit" value="Submit Review">

  </form>

    <footer>
        <p>
            <span id="currentyear"></span>
        </p>
        <p id="lastModified"></p>

    </footer>

</body>
</html>
